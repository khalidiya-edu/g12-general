<!DOCTYPE html>
<html lang="en">
<head><!-- /frame-runtime -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 12 General – End-of-Term 1 English Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0f766e; --accent2:#14b8a6; --soft:#e6f6f4;
  --ink:#1c2230; --muted:#5d6678; --line:#e3e6ee; --bg:#f6f7fb; --card:#fff;
  --ok:#15803d; --okbg:#e8f6ec; --bad:#b42318; --badbg:#fdecea; --warn:#b45309; --warnbg:#fff4e0;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
button{font:inherit;cursor:pointer}
textarea,input{font:inherit}
h1,h2,h3,h4{line-height:1.25;margin:0}
/* header */
.top{background:var(--accent);color:#fff;padding:22px 20px 0;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:var(--accent2);opacity:.35}
.top-in{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.top h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600}
.scorebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.meter{flex:1;min-width:160px;max-width:320px;height:9px;background:rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .4s}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#fff;text-decoration:none;padding:11px 15px;border-radius:12px 12px 0 0;font-weight:600;font-size:14.5px;white-space:nowrap;opacity:.82}
nav a:hover{opacity:1;background:rgba(255,255,255,.12)}
nav a.on{background:var(--bg);color:var(--accent);opacity:1}
main{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
section.view{display:none}
section.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.h2{font-size:24px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card h3{font-size:18px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* overview table */
table.ov{width:100%;border-collapse:collapse;font-size:15px}
table.ov th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
table.ov td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.ov td.m{font-weight:800;color:var(--accent);text-align:right;white-space:nowrap}
table.ov a{color:var(--accent);font-weight:700;text-decoration:none}
.bigstat{display:flex;gap:14px;flex-wrap:wrap}
.bigstat div{flex:1;min-width:140px;background:var(--soft);border-radius:12px;padding:14px 16px}
.bigstat b{display:block;font-size:26px;color:var(--accent)}
/* flashcards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.flip{perspective:900px;height:150px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:12px;padding:14px;backface-visibility:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.flip .f{background:#fff;justify-content:center;align-items:center;text-align:center}
.flip .f b{font-size:19px;color:var(--accent)}
.flip .f span{font-size:12px;color:var(--muted);margin-top:6px}
.flip .b{background:var(--soft);transform:rotateY(180deg);font-size:13.5px;overflow:auto}
.flip .b em{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
.grouph{font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.grouph:first-child{margin-top:0}
/* passage */
.passage{font-family:"Literata",Georgia,serif;font-size:17px;line-height:1.8;background:#fffdf8;border:1px solid #efe7d6;border-radius:var(--r);padding:22px 24px}
.passage h3{font-family:"Plus Jakarta Sans",sans-serif;text-align:center;font-size:19px;margin-bottom:12px;color:var(--accent)}
.passage p{margin:0 0 14px}
.passage p .pn{font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.gap{display:inline-block;min-width:96px;border-bottom:2px dashed var(--accent);padding:0 6px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif;font-size:15px;color:var(--accent);text-align:center;line-height:1.5}
.gap.ok{border-bottom:2px solid var(--ok);color:var(--ok);background:var(--okbg);border-radius:4px 4px 0 0}
.gap.bad{border-bottom:2px solid var(--bad);color:var(--bad);background:var(--badbg);border-radius:4px 4px 0 0}
.readwrap{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start}
.readwrap .passage{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
@media(max-width:900px){.readwrap{grid-template-columns:1fr}.readwrap .passage{position:static;max-height:none}}
/* questions */
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:12px}
.q .qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.q .num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px}
.q .qt{font-weight:600}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:15px;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt .L{flex:none;font-weight:800;color:var(--accent);width:18px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .L{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .L{color:var(--bad)}
.opts.inline{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.opts.inline{grid-template-columns:1fr}}
.why{display:none;margin-top:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:#5a3a06}
.why.show{display:block}
.why b.okt{color:var(--ok)} .why b.badt{color:var(--bad)}
.secscore{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:12px 16px;margin:6px 0 18px;font-weight:600}
.secscore b{color:var(--accent);font-size:18px}
/* grammar */
details.gp{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.gp summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;font-weight:700}
details.gp summary::-webkit-details-marker{display:none}
details.gp summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--accent);font-weight:400}
details.gp[open] summary::after{content:"–"}
details.gp .body{padding:0 16px 16px}
.rule{background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ex{margin:4px 0 12px;padding-left:18px}
.ex li{margin-bottom:4px}
.ex u{text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
/* writing */
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;min-height:140px;line-height:1.6;background:#fff}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea.plan{min-height:58px}
.counter{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted);margin:8px 0 4px}
.counter b{color:var(--ink)}
.prog{height:8px;flex:1;min-width:140px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--warn);transition:width .3s}
.prog i.done{background:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}
.phr{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 14px}
.phr button{border:1px dashed var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600}
.phr button:hover{background:var(--soft)}
.model{display:none;background:#f3fbf5;border:1px solid #cbe9d4;border-radius:12px;padding:14px 16px;margin-top:10px}
.model.show{display:block}
.model p{margin:0 0 10px}
.rub{width:100%;border-collapse:collapse;font-size:14.5px}
.rub td{padding:8px 6px;border-bottom:1px solid var(--line)}
.rub select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid var(--line)}
.rub tr.tot td{font-weight:800;border-bottom:0;color:var(--accent)}
.prompt{border-left:4px solid var(--accent);background:#fff;padding:14px 16px;border-radius:0 12px 12px 0;margin-bottom:14px}
.prompt ul{margin:8px 0 6px;padding-left:20px}
/* tips */
.tip h4{font-size:16px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.tip ul{margin:6px 0 0;padding-left:18px}
.tip li{margin-bottom:5px}
.skillbar{display:grid;grid-template-columns:170px 1fr 60px;gap:10px;align-items:center;margin-bottom:9px;font-size:14.5px}
.skillbar .prog i{background:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;transition:.3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.quizbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.quizdef{font-size:18px;font-weight:600;margin:6px 0 12px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="eyebrow">English · End-of-Term 1 Revision · 2026–2027</div>

    <div class="chips" id="chips"></div>
    <div class="scorebar">
      <span>Mock exam (Parts 1–3): <b id="mockTop">0</b> / 60</span>
      <span class="meter"><i id="mockBar"></i></span>
      <span id="answeredTop" style="opacity:.85"></span>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="main"></main>
<footer>Practice material written to match the Cycle 3 End-of-Term 1 Test Specifications. The real exam uses different texts.</footer>

etween commas. Use <b>who<\/b> (people), <b>which<\/b> (things), <b>whose<\/b> (possession), <b>where<\/b> (places). <b>Never use ‘that’<\/b> in a non-defining clause.", "examples": ["My uncle, <u>who is an engineer<\/u>, works in Abu Dhabi.", "Dubai, <u>which is a global business hub<\/u>, attracts many workers."], "check": {"q": "Telecommuting, ____ saves time, is popular with parents.", "opts": ["which", "that", "who"], "why": "Thing + commas → which (never ‘that’ after a comma)."}}, {"code": "G.18", "name": "Reported speech", "rule": "When reporting, move the tense <b>one step back<\/b>: present → past, will → would, can → could, need → needed. <b>say<\/b> (something) / <b>tell<\/b> (someone). Change pronouns and time words (today → that day).", "examples": ["“I am tired.” → She <u>said that she was<\/u> tired.", "“We will hire you.” → They <u>told him that they would<\/u> hire him."], "check": {"q": "“I need more experience.” → He said that he ____ more experience.", "opts": ["needed", "needs", "will need"], "why": "Present simple moves back to past simple: need → needed."}}, {"code": "G.2.8", "name": "Adverbs of degree", "rule": "They show <b>how much<\/b>: very, extremely, really, quite, fairly, rather, completely, <b>too<\/b> (more than needed – negative), <b>enough<\/b> (comes AFTER the adjective).", "examples": ["The interview was <u>extremely<\/u> difficult.", "He isn’t <u>experienced enough<\/u> for the role.", "The salary is <u>too<\/u> low to live on."], "check": {"q": "The salary is ____ low for me to live on.", "opts": ["too", "enough", "much"], "why": "too + adjective + to-infinitive = more than is acceptable."}}, {"code": "G.6.2", "name": "Subordinating conjunctions", "rule": "They join a main clause to a dependent clause: <b>because, since<\/b> (reason), <b>although, even though<\/b> (contrast), <b>unless<\/b> (= if not), <b>so that<\/b> (purpose), <b>while, when, as soon as<\/b> (time).", "examples": ["She got the job <u>although<\/u> she had little experience.", "You won’t save money <u>unless<\/u> you make a budget."], "check": {"q": "She got the job ____ she had very little experience.", "opts": ["although", "because", "unless"], "why": "Contrast (surprising result) → although."}}], "grammar_text": {"title": "Working from Anywhere", "text": "Thanks to modern technology, the way we work [1] completely. Telecommuting, [2] was once quite rare, is now common in many industries. In the UAE, several organisations now allow their employees [3] from home on certain days. Many workers say that they feel [4] productive at home because there are fewer interruptions and no stressful journeys. This is particularly true for parents of young children, who appreciate being able to spend more time at home. However, telecommuting also has some drawbacks. Some employees feel lonely, and others find it hard to separate work from family life. Companies are changing, too. More and more tasks are outsourced to freelancers in other countries, [5] this can reduce job security for local staff. In a recent survey, one manager said that her company was planning to offer flexible hours to everyone by 2030 because she believed it would attract more talented staff. Experts agree that the workforce of tomorrow will need to upgrade its skills regularly in order to keep up with globalization.", "gaps": [{"opts": ["is being transformed", "is transforming", "transforms"], "code": "G.10.3", "why": "The way we work doesn’t transform itself; it is happening now → present continuous passive."}, {"opts": ["which", "that", "who"], "code": "G.4.2", "why": "Extra information about a thing, between commas → which."}, {"opts": ["to work", "working", "work"], "code": "G.19.2", "why": "allow + someone + to-infinitive."}, {"opts": ["extremely", "enough", "too"], "code": "G.2.8", "why": "‘enough’ must come after the adjective, and ‘too’ is negative. extremely productive = very productive."}, {"opts": ["although", "so that", "unless"], "code": "G.6.2", " ple believe that advertising does more harm than good, especially for teenagers.", "task": "Write an opinion essay in which you:", "bullets": ["give your opinion: does advertising do more harm than good? Give reasons.", "explain how advertising influences teenagers’ spending, with examples.", "give advice to teenagers on how to make smart choices as consumers."], "min_words": 200, "planner": [["Introduction", "Introduce the topic + state your opinion clearly."], ["Body 1 – Opinion + reasons", "Reason 1 + example. Reason 2 + example."], ["Body 2 – How adverts influence spending", "Influencers, ‘limited offers’, brands… real examples."], ["Body 3 – Advice", "2–3 pieces of practical advice for teenagers."], ["Conclusion", "Repeat your opinion in new words + final thought."]], "phrases": [["FL.16 Expressing opinion", ["In my opinion, …", "I strongly believe that …", "From my point of view, …", "It seems to me that …", "I am convinced that …"]], ["FL.46 Evidence-based argument", ["According to experts, …", "Research shows that …", "For example, / For instance, …", "This is supported by …", "As a result, …", "Furthermore, / Moreover, …", "On the other hand, …"]], ["FL.24 Giving advice", ["I would advise teenagers to …", "You should / ought to …", "It is a good idea to …", "If I were you, I would …", "Why not …?", "Try to avoid …-ing"]], ["Concluding", ["In conclusion, …", "To sum up, …", "All in all, …", "For these reasons, …"]]], "model": ["Every day, teenagers are surrounded by advertisements on social media, television and even in video games. Although adverts can sometimes be useful, I strongly believe that they do more harm than good for young people.", "My main reason is that advertising encourages unnecessary spending. Influencers are paid to promote products, and many teenagers trust them as if they were friends. For example, when a famous influencer posts about new trainers, thousands of followers rush to buy them, even if their old shoes are perfectly fine. More const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, html="") => { const e=document.createElement(tag); for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } if(html!==undefined) e.innerHTML=html; return e; };
const store = { get(k,d){ try{const v=localStorage.getItem("g12rev:"+D.short+":"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{localStorage.setItem("g12rev:"+D.short+":"+k, JSON.stringify(v));}catch(e){} } };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }
// stable shuffle
function seedRand(str){ let x=0; for(const c of str) x=(x*31+c.charCodeAt(0))|0; return ()=>{ x^=x<<13; x^=x>>17; x^=x<<5; return ((x>>>0)%10000)/10000; }; }
function shuffled(arr, seed){ const r=seedRand(seed); const a=arr.map((v,i)=>({v,i})); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------------- score state ---------------- */
// sections: id -> {marks per q, questions: {qid: correct(bool)}}
const S = { sections:{}, answers: store.get("answers", {}) };
function regSection(id, name, perQ, count, mock, skillOf){ S.sections[id]={name,perQ,count,mock,skillOf:skillOf||{}}; }
function record(qid, ok){ S.answers[qid]=ok; store.set("answers",S.answers); refreshScores(); }
function secScore(id){ const s=S.sections[id]; let got=0, done=0; for(let i=0;i<s.count;i++){ const v=S.answers[id+":"+i]; if(v!==undefined){done++; if(v) got+=s.perQ;} } return {got,done,max:s.perQ*s.count}; }
function refreshScores(){
  let mock=0, done=0, total=0;
  for(const id in S.sections){ const s=S.sections[id], r=secScore(id);
    const el=document.querySelector(`[data-sec="${id}"]`); if(el) el.innerHTML=`<span>Your score: <b>${r.got}</b> / ${r.max}</span><span class="small muted">${r.done} of ${s.count} answered</span>`;
    if(s.mock) mock+=r.got; done+=r.done; total+=s.count; }
  $("#mockTop").textContent=mock; $("#mockBar").style.width=(mock/60*100)+"%";
  $("#answeredTop").textContent=`${done} / ${total} practice questions answered`;
  if(typeof renderScorePage==="function") renderScorePage();
}

/* ---------------- MCQ builder ---------------- */
function mcq(container, qid, opts, why, {inline=false, onAnswer=null}={}){
  const order = shuffled(opts, qid);
  const box = h("div",{class:"opts"+(inline?" inline":"")});
  const w = h("div",{class:"why"});
  const answer = (pickIdx, silent) => {
    [...box.children].forEach((b,k)=>{ b.disabled=true; const orig=order[k].i; if(orig===0) b.classList.add("ok"); else if(k===pickIdx) b.classList.add("bad"); });
    const ok = order[pickIdx].i===0;
    w.innerHTML = (ok?'<b class="okt">✓ Correct.</b> ':'<b class="badt">✗ Not quite.</b> The answer is <b>'+"ABC"[order.findIndex(o=>o.i===0)]+'</b>. ')+why;
    w.classList.add("show");
    if(onAnswer) onAnswer(ok, order[pickIdx].v);
    if(!silent) record(qid, ok);
  };
  order.forEach((o,k)=>{ box.appendChild(h("button",{class:"opt",onclick:()=>answer(k)},`<span class="L">${"ABC"[k]}</span><span>${esc(o.v)}</span>`)); });
  container.append(box,w);
  // restore
  if(S.answers[qid]!==undefined && store.get("pick:"+qid,null)!==null){ answer(store.get("pick:"+qid), true); }
  box.addEventListener("click",e=>{ const b=e.target.closest(".opt"); if(b){ store.set("pick:"+qid,[...box.children].indexOf(b)); } }, true);
}
function resetSection(id){ const s=S.sections[id]; for(let i=0;i<s.count;i++){ delete S.answers[id+":"+i]; store.set("pick:"+id+":"+i,null);} store.set("answers",S.answers); build(); go(location.hash.slice(1)||"overview"); toast("Section reset – try again!"); }

/* ---------------- gap fill ---------------- */
function gapFill(parent, id, title, text, gaps, perQ, mock, tagFn){
  regSection(id, title, perQ, gaps.length, mock);
  const wrap=h("div",{class:"grid2"});
  const pas=h("div",{class:"passage"});
  pas.innerHTML=`<h3>${esc(title)}</h3><p>`+esc(text).replace(/\[(\d)\]/g,(m,n)=>`<span class="gap" id="${id}-g${n}">(${n}) ________</span>`)+`</p>`;
  const qs=h("div");
  gaps.forEach((g,i)=>{
    const q=h("div",{class:"q"});
    q.innerHTML=`<div class="qh"><div class="num">${i+1}</div><div class="qt">Gap (${i+1}) ${tagFn?'<span class="tag">'+tagFn(g)+'</span>':''}</div></div>`;
    mcq(q, id+":"+i, g.opts, g.why, {inline:true, onAnswer:(ok,val)=>{ const gp=$("#"+id+"-g"+(i+1), pas); gp.textContent=`(${i+1}) ${val}`; gp.className="gap "+(ok?"ok":"bad"); }});
    qs.appendChild(q);
  });
  wrap.append(pas,qs);
  parent.appendChild(wrap);
  const sc=h("div",{class:"secscore","data-sec":id});
  const rb=h("button",{class:"btn ghost small",onclick:()=>resetSection(id)},"↺ Try again");
  const holder=h("div",{class:"row",style:"justify-content:space-between;margin-top:6px"}); holder.append(sc,rb);
  sc.style.flex="1";
  parent.appendChild(holder);
}

/* ---------------- views ---------------- */
const VIEWS=[["overview","Overview"],["vocabulary","Vocabulary"],["grammar","Grammar"],["reading-a","Reading 3A"],["reading-b","Reading 3B"],["writing","Writing"],["tips","Exam tips"],["score","My score"]];

function build(){
  const main=$("#main"); main.innerHTML=""; S.sections={};
  $("#ttl").textContent=D.grade+" — Final Exam Revision";

function counts(t){ const words=(t.trim().match(/[A-Za-z0-9’'-]+/g)||[]).length; const sents=(t.match(/[^.!?]+[.!?]+/g)||[]).filter(s=>s.trim().length>2).length; const paras=t.split(/\n\s*\n/).filter(p=>p.trim()).length; return {words,sents,paras}; }
function rubricTable(parent, key, rows, total, label){
  const t=h("table",{class:"rub"});
  const saved=store.get("rub:"+key,{});
  rows.forEach((r,i)=>{ const tr=h("tr"); tr.innerHTML=`<td>${esc(r[0])}</td><td style="text-align:right;white-space:nowrap"></td>`;
    const sel=h("select"); for(let k=0;k<=r[1];k++) sel.appendChild(h("option",{value:k},k)); sel.value=saved[i]||0;
    sel.onchange=()=>{ const s=store.get("rub:"+key,{}); s[i]=+sel.value; store.set("rub:"+key,s); upd(); refreshScores(); };
    tr.lastChild.append(sel, document.createTextNode(" / "+r[1])); t.appendChild(tr); });
  const tot=h("tr",{class:"tot"}); tot.innerHTML=`<td>${label}</td><td style="text-align:right"><span></span> / ${total}</td>`; t.appendChild(tot);
  const upd=()=>{ const s=store.get("rub:"+key,{}); tot.querySelector("span").textContent=rows.reduce((a,_,i)=>a+(s[i]||0),0); };
  upd(); parent.appendChild(t);
}
function writingScore(){ let s=0; ["sum","ess"].forEach(k=>{ const v=store.get("rub:"+k,{}); for(const i in v) s+=v[i]; }); return s; }

  // 4.2

  const g2=h("div",{class:"grid2"});

  L.appendChild(h("p",{class:"small",style:"font-weight:700;margin:16px 0 4px"},"Useful language – click a phrase to add it to your essay"));

  essay.oninput=upd2; R.append(essay,ct2); upd2();

  R.appendChild(rowb);

/* ---------------- tips ---------------- */
function buildTips(){
  const adv=D.short.includes("Advanced");
  const T=[
    ["🔤","Part 1 · Vocabulary gap fill",["Read the WHOLE text first to understand the topic.","Look at the words just before and after the gap: is it a noun, verb, adjective or phrase?","Check grammar clues: <i>a / an</i>, plural <i>-s</i>, prepositions (e.g. <i>raise ___</i>, <i>traffic ___</i>).","Try each option in the gap and read the sentence aloud in your head.","Look for clues in the next sentence: writers often explain the gap word later."]],
    ["🧩","Part 2 · Grammar gap fill",["Decide which grammar point is being tested (passive? conditional? linker?).","Check tense clues: <i>now, right now, every day, last week, if</i>.","Commas around a clause → non-defining relative (<i>which / who</i>, never <i>that</i>).","Linkers: is the next idea a contrast, an addition or a result?","Reread the full sentence with your answer before moving on."]],
    ["🔎","Specific information & Details",["Underline the key words in the question.","Scan the text for those words or synonyms (the text often uses different words).","Read the sentence before and after carefully.","Watch for distractors: numbers, names or words from the text that are in the WRONG place."]],
    ["💡","Main point / Overall meaning",["Main point of a paragraph: read its first and last sentences (topic sentence).","Overall meaning: think about the title, the introduction and the conclusion.","Avoid answers that are too narrow (only one detail) or too extreme (<i>always, never, all</i>)."]],
    ["🕵️","Inference",["The answer is NOT written directly – you must use clues.","Ask: what does the writer suggest or imply?","The correct answer must be supported by the text; don’t use only your own opinion.","For ‘what would the writer advise…’, apply the writer’s main idea to the new situation."]],
    ["🎭","Mood, tone & attitude",["Look for opinion words: adjectives and adverbs (<i>surprisingly, sadly, hopeful, outdated</i>).","Notice time words that show a change: <i>at first … but now</i>.","Common tones: critical, balanced, hopeful, worried, humorous, neutral."]],
    ["🌍","Connections",["The question links the text to the real world, another situation or your own experience.","First decide what the text’s main idea or suggestion is.","Then choose the example that matches that idea most closely."]],
    ["📝","4.1 "+(adv?"Compare & summarise":"Summary"),[adv?"Find the TWO points of view (usually one per paragraph).":"Find the main idea in each part of the text.", "Use your own words – change vocabulary and sentence structure. Do NOT copy sentences.", adv?"Use comparing/contrasting linkers: <i>whereas, while, on the other hand, in contrast</i>.":"Leave out examples and small details.", "Write exactly 4–5 sentences."]],
    ["🖋️","4.2 "+(adv?"Comparative essay (220+ words)":"Opinion essay (200+ words)"),["Spend 5 minutes planning: one paragraph for each bullet point.","Introduction → body paragraphs → conclusion.","Answer EVERY bullet point – missing one costs a lot of marks.","Start each paragraph with a clear topic sentence.", adv?"Compare in every paragraph and give your preference with reasons and examples.":"Give your opinion clearly and support it with reasons and examples.","Save 3–5 minutes to check spelling, punctuation and word count."]],
    ["⏱️","On exam day",["Read every instruction carefully.","Don’t spend too long on one question – mark it and come back.","Answer every multiple-choice question; there is no penalty for guessing.","Check that you have chosen only ONE answer per question."]],
  ];
  const v=$("#v-tips"); v.innerHTML=`<div class="h2">Exam tips by question type</div><p class="sub">Each reading question in your exam tests one of these skills. Learn how to approach each type.</p>`;
  const g=h("div",{class:"grid2"});
  T.forEach(([ic,t,list])=>{ const c=h("div",{class:"card tip"}); c.innerHTML=`<h4><span>${ic}</span>${t}</h4><ul class="small">${list.map(x=>`<li>${x}</li>`).join("")}</ul>`; g.appendChild(c); });
  v.appendChild(g);
}

/* ---------------- score page ---------------- */
function renderScorePage(){
  const el=$("#scoreBody"); if(!el) return;
  let mock=0; const rows=[];
  for(const id in S.sections){ const s=S.sections[id], r=secScore(id); if(s.mock) mock+=r.got; rows.push([s.name+(s.mock?"":" (extra)"), r.got, r.max, r.done, s.count]); }
  const ws=writingScore();
  // skills
  const sk={};
  ["reading-a","reading-b"].forEach(id=>{ const s=S.sections[id]; if(!s) return; for(const i in s.skillOf){ const k=s.skillOf[i]; sk[k]=sk[k]||{ok:0,done:0,tot:0}; sk[k].tot++; const v=S.answers[id+":"+i]; if(v!==undefined){ sk[k].done++; if(v) sk[k].ok++; } } });
  el.innerHTML=`<div class="bigstat" style="margin-bottom:18px"><div><span class="small muted">Mock exam (Parts 1–3)</span><b>${mock} / 60</b></div><div><span class="small muted">Writing (self-marked)</span><b>${ws} / 40</b></div><div><span class="small muted">Estimated total</span><b>${mock+ws} / 100</b></div></div>
  <div class="grid2"><div class="card"><h3>By section</h3><table class="ov"><thead><tr><th>Section</th><th>Answered</th><th style="text-align:right">Score</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="small muted">${r[3]} / ${r[4]}</td><td class="m">${r[1]} / ${r[2]}</td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h3>Reading by question type</h3><p class="small muted" style="margin-top:-4px">Your weakest type is the one to practise next.</p>${Object.entries(sk).map(([k,v])=>`<div class="skillbar"><span>${esc(k)}</span><span class="prog"><i style="width:${v.done?v.ok/v.done*100:0}%"></i></span><span class="small muted">${v.ok}/${v.done||0}</span></div>`).join("")}
  <div class="row" style="margin-top:16px"><button class="btn" id="resetAll">↺ Reset all answers</button></div></div></div>`;
  $("#resetAll").onclick=()=>{ for(const id in S.sections){ for(let i=0;i<S.sections[id].count;i++){ delete S.answers[id+":"+i]; store.set("pick:"+id+":"+i,null);} } store.set("answers",S.answers); build(); go("score"); toast("All multiple-choice answers reset"); };
}

/* ---------------- routing ---------------- */
function go(id){ if(!VIEWS.some(v=>v[0]===id)) id="overview"; document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+id)); document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===id)); }
window.addEventListener("hashchange",()=>{ go(location.hash.slice(1)); window.scrollTo({top:0}); });
build(); go(location.hash.slice(1)||"overview");
</script>
</body>
</html>
